substitutions:
  name: "deye-sun-12k-via-esp32-c6"
  device_description: "Deye SUN-12K via ESP32-C6"
  modbus_controller_id: deye_inverter
  device_type: deye_inverter

esphome:
  name: ${name}
  friendly_name: Deye Inverter Data Logger

esp32:
  board: dfrobot_firebeetle2_esp32c6
  framework:
    type: esp-idf

# Enable logging, API, and OTA
logger:
  level: VERBOSE
  
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

status_led:
  pin:
    number: GPIO15 # The onboard LED for FireBeetle C6
    inverted: false

uart:
  id: mod_bus
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  # data_bits: 8
  stop_bits: 1
  # parity: EVEN # Required for Deye hybrid inverters
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: [0x01]

modbus:
  id: modbus1
  uart_id: mod_bus
  flow_control_pin: GPIO4 # RE/DE Bridge
  send_wait_time: 100ms

modbus_controller:
  - id: ${modbus_controller_id}
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 30s

# --- SENSORS & CONTROLS ---

sensor:
  - platform: template
    name: "API Connection Test Value"
    id: api_test_sensor
    update_interval: 10s
    lambda: |-
      // Generates a random integer between 1 and 100 every 10 seconds
      return rand() % 100 + 1;
    unit_of_measurement: "%"
    icon: "mdi:wifi-check"


  # --- Power & Generation ---
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "PV1 Power"
    id: ${device_type}_pv1_power
    register_type: holding
    address: 672
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "PV2 Power"
    id: ${device_type}_pv2_power
    register_type: holding
    address: 673
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD

  # --- Battery Metrics ---
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    skip_updates: 2
    name: "Inverter Battery SOC"
    id: ${device_type}_inverter_battery_soc
    register_type: holding
    address: 588
    unit_of_measurement: "%"
    device_class: "battery"
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Inverter Battery Power"
    id: ${device_type}_inverter_battery_power
    register_type: holding
    address: 590
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Inverter Battery Voltage"
    id: ${device_type}_inverter_battery_voltage
    register_type: holding
    address: 587
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 2
    value_type: U_WORD
    filters:
      - multiply: 0.01

  # --- Load & Phase Power ---
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Total Load Power"
    id: ${device_type}_total_load_power
    register_type: holding
    address: 653
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Load L1 Power"
    id: ${device_type}_load_l1_power
    register_type: holding
    address: 650
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Load L2 Power"
    id: ${device_type}_load_l2_power
    register_type: holding
    address: 651
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Load L3 Power"
    id: ${device_type}_load_l3_power
    register_type: holding
    address: 652
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD

  # --- Daily Energy Totals ---
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Day PV Energy"
    id: ${device_type}_day_pv_energy
    register_type: holding
    address: 529
    unit_of_measurement: "kWh"
    device_class: "energy"
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Day Battery Charge"
    id: ${device_type}_day_battery_charge
    register_type: holding
    address: 514
    unit_of_measurement: "kWh"
    device_class: "energy"
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Day Battery Discharge"
    id: ${device_type}_day_battery_discharge
    register_type: holding
    address: 515
    unit_of_measurement: "kWh"
    device_class: "energy"
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Day Load Energy"
    id: ${device_type}_day_load_energy
    register_type: holding
    address: 526
    unit_of_measurement: "kWh"
    device_class: "energy"
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1
